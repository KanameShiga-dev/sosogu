<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注ぐ</title>
<meta name="description" content="水が満ちるほど、器の音は高くなる。目ではなく耳で、器を満たすブラウザゲーム。">

<meta property="og:description" content="水が満ちるほど、器の音は高くなる。目ではなく耳で、器を満たすブラウザゲーム。">

<meta property="og:image" content="https://kanameshiga-dev.github.io/sosogu/og.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: 夜の台所。タイトル（器と中身を選び、モードを選ぶ）→ ゲーム（ポットと器の舞台 / 結果 / 長押しボタン / 記録） */
:root{
  --ink:#0e151c;
  --ink-2:#17222d;
  --line:#283541;
  --porcelain:#dfe6eb;
  --mist:#8c9aa6;
  --water:#7cc0dc;
  --glass:#bcd3df;
  --pot:#2c3d4b;
  --spill:#e2896f;
  --good:#a3d4ac;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--ink);color:var(--porcelain);
  font-family:var(--f-body);font-size:15px;line-height:1.7;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:22px 44px}
.screen{display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}

/* ---- タイトル ---- */
.title-screen{gap:28px;padding-top:12px}
.hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 18px;align-items:end}
.pourline{grid-row:1/3;width:2px;height:150px;align-self:start;border-radius:2px;overflow:hidden;
  background:linear-gradient(var(--line),var(--line));position:relative}
.pourline span{position:absolute;left:0;top:-60%;width:100%;height:60%;
  background:linear-gradient(transparent,var(--water));animation:fall 2.4s cubic-bezier(.5,0,.8,.6) infinite}
@keyframes fall{to{top:100%}}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(84px,24vw,128px);line-height:.95;margin:0;letter-spacing:.1em}
.lead{margin:14px 0 0;color:var(--mist);font-size:14px;line-height:1.9;max-width:28em}

.settings{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center}
.lab{font-size:12px;color:var(--mist);letter-spacing:.08em}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;justify-self:start}
.seg button{appearance:none;border:0;background:transparent;color:var(--mist);font:500 13px/1 var(--f-body);padding:9px 15px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--porcelain);color:var(--ink)}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mode{appearance:none;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;
  background:var(--ink-2);border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;color:var(--porcelain);font-family:var(--f-body)}
.mode:hover{border-color:var(--water)}
.mode-name{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:.08em;line-height:1.2}
.mode-desc{font-size:13px;color:var(--mist);line-height:1.7}
.mode-best{margin-top:auto;padding-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--water);font-variant-numeric:tabular-nums}
.mode-go{font-size:13px;font-weight:700;color:var(--water);letter-spacing:.1em}
.fine{margin:0;font-size:12px;color:var(--mist)}

/* ---- ゲーム ---- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.bar-left{display:flex;align-items:center;gap:12px;min-width:0}
.mode-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.08em}
.sound{appearance:none;display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  border:1.5px solid var(--water);background:transparent;color:var(--water);
  font:700 13px/1 var(--f-body);letter-spacing:.06em;padding:10px 14px;border-radius:999px}
.sound .dot{width:8px;height:8px;border-radius:50%;background:var(--spill)}
.sound[data-on="true"]{border-color:var(--line);color:var(--mist);font-weight:500}
.sound[data-on="true"] .dot{background:var(--good)}

.stage{position:relative;border:1px solid var(--line);border-radius:20px;overflow:hidden;
  background:radial-gradient(110% 80% at 50% 0%,var(--ink-2),var(--ink) 72%)}
canvas{display:block;width:100%;height:clamp(320px,52vh,450px);touch-action:none}
.status{position:absolute;left:12px;right:12px;bottom:10px;margin:0;text-align:center;font-size:13px;color:var(--mist);letter-spacing:.05em;pointer-events:none}
.tag{position:absolute;right:14px;top:12px;margin:0;font-size:12px;color:var(--mist);letter-spacing:.06em;pointer-events:none}

.info{min-height:126px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:14px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:14px}
.rules li{display:flex;gap:10px}
.rules b{font-family:var(--f-mono);font-weight:500;color:var(--water);min-width:1.2em}
.res-label{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:.08em;text-wrap:balance}
.res--over .res-label{color:var(--spill)}
.res--top .res-label{color:var(--good)}
.res-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:6px}
.k{display:block;font-size:11px;color:var(--mist);letter-spacing:.08em}
.v{display:block;font-family:var(--f-mono);font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.v small{font-size:12px;color:var(--mist);margin-left:3px}
.note{margin:4px 0 0;font-size:12.5px;color:var(--mist)}
.badge{display:inline-block;margin-left:10px;padding:1px 8px;border:1px solid var(--good);border-radius:999px;font-family:var(--f-body);font-size:11px;font-weight:500;color:var(--good);letter-spacing:.06em;vertical-align:middle}

.pour{
  appearance:none;width:100%;height:78px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--porcelain);background:transparent;color:var(--porcelain);
  font:700 17px/1 var(--f-body);letter-spacing:.14em;touch-action:none;
  transition:background-color .15s,color .15s,border-color .15s;
}
.pour:hover{background:color-mix(in srgb,var(--porcelain) 6%,transparent)}
.pour[data-state="pouring"],.pour[data-state="settling"]{background:var(--water);border-color:var(--water);color:var(--ink)}
.pour[data-state="demo"],.pour[data-state="model"],.pour[data-state="mgap"]{opacity:.45;cursor:default}
.pour[data-state="result"],.pour[data-state="mready"]{border-color:var(--water);color:var(--water)}
.pour:focus-visible,.seg button:focus-visible,.ghost:focus-visible,.sound:focus-visible,.mode:focus-visible{outline:2px solid var(--water);outline-offset:3px}
.hint{margin:-6px 0 0;text-align:center;font-size:12px;color:var(--mist)}
.hint kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end;min-height:42px}
.ghost{appearance:none;border:1px solid var(--line);background:transparent;color:var(--porcelain);font:500 13px/1 var(--f-body);padding:11px 16px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.ghost:hover{border-color:var(--mist)}
.ghost:disabled{opacity:.4;cursor:default}

.stats{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:18px;align-items:end}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;min-width:0}
.chip{font-family:var(--f-mono);font-size:11.5px;font-variant-numeric:tabular-nums;padding:2px 7px;border-radius:6px;background:var(--ink-2);color:var(--porcelain)}
.chip.o{color:var(--spill)}
.chip.t{color:var(--good)}
.empty{font-size:12px;color:var(--mist)}

.foot{margin:6px 0 0;font-size:12px;color:var(--mist);line-height:1.8;display:grid;gap:6px}
.foot p{margin:0}
.foot code{font-family:var(--f-mono);color:var(--porcelain);font-size:12px}

@media (max-width:460px){
  .modes{grid-template-columns:1fr}
  .v{font-size:19px}
  .stats{grid-template-columns:auto auto}
  .chips{grid-column:1/-1;justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){ .pourline span{animation:none;top:40%} }
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
</style>
</head>
<body>

<div class="wrap">
  <!-- タイトル -->
  <section class="screen title-screen" id="screen-title">
    <div class="hero">
      <div class="pourline" aria-hidden="true"><span></span></div>
      <h1 class="big">注ぐ</h1>
      <p class="lead">水が満ちるほど、器の音は高くなる。<br>目ではなく耳で、器を満たすゲーム。イヤホン推奨。</p>
    </div>

    <div class="settings">
      <span class="lab">器</span>
      <div class="seg" id="seg-vessel" role="group" aria-label="器">
        <button type="button" id="v-glass" data-v="glass">コップ</button>
        <button type="button" id="v-bottle" data-v="bottle">水筒</button>
        <button type="button" id="v-mug" data-v="mug">マグ</button>
      </div>
      <span class="lab">中身</span>
      <div class="seg" id="seg-liquid" role="group" aria-label="中身">
        <button type="button" id="l-water" data-v="water">水</button>
        <button type="button" id="l-hot" data-v="hot">お湯</button>
      </div>
    </div>

    <div class="modes">
      <button class="mode" type="button" id="mode-edge" data-g="edge">
        <span class="mode-name">通常モード</span>
        <span class="mode-desc">縁ぎりぎりまで注ぐ。水位は見えません。最初に一度だけ、見ながら音を覚える練習があります。</span>
        <span class="mode-best" id="best-edge"></span>
        <span class="mode-go">はじめる</span>
      </button>
      <button class="mode" type="button" id="mode-match" data-g="match">
        <span class="mode-name">お手本モード</span>
        <span class="mode-desc">お手本が注ぐ音を聴いて、同じ量を目隠しで注ぐ。多すぎても少なすぎても減点。</span>
        <span class="mode-best" id="best-match"></span>
        <span class="mode-go">はじめる</span>
      </button>
    </div>
  </section>

  <!-- ゲーム -->
  <section class="screen" id="screen-game" hidden>
    <div class="bar">
      <div class="bar-left">
        <button class="ghost" id="back" type="button">‹ タイトル</button>
        <p class="mode-title" id="mode-title">通常モード</p>
      </div>
      <button class="sound" id="sound" type="button" data-on="false"><span class="dot"></span><span id="sound-label">音を出す</span></button>
    </div>

    <div class="stage">
      <canvas id="cv" aria-label="ポットと器"></canvas>
      <p class="tag" id="tag"></p>
      <p class="status" id="status"></p>
    </div>

    <section class="info" id="info" aria-live="polite"></section>

    <button class="pour" id="pour" type="button" data-state="ready">押しているあいだ注ぐ</button>
    <p class="hint">スペースキーでも注げます（<kbd>Space</kbd> を押しているあいだ）</p>

    <div class="row"><button class="ghost" id="demo" type="button" hidden>お手本をもう一度</button></div>

    <div class="stats">
      <div><span class="k" id="best-k">ベスト</span><span class="v" id="best">—</span></div>
      <div><span class="k">直近5回の平均</span><span class="v" id="avg">—</span></div>
      <div class="chips" id="chips"></div>
    </div>

  </section>
</div>

<script>
(() => {
  // ---------- 器と中身 ----------
  // prof: [高さmm, 内側の半径mm] を底から口まで
  const VESSELS = {
    glass: {
      name: 'コップ', prof: [[0, 33], [110, 37]], kind: 'tube',
      Q: 64000, qRes: 13, gurgle: 1, h3: 1,
      start: [0, 0.18], target: [0.35, 0.92], scale: 7,
      note: '深さ110mm・口径74mm。水面から縁までの空気柱が鳴る閉管の共鳴。<code>f ≈ c ÷ 4(L + 0.6r)</code>'
    },
    bottle: {
      name: '水筒', prof: [[0, 30], [140, 30], [152, 20], [158, 13], [200, 13]], kind: 'helm', neckStart: 158,
      Q: 18000, qRes: 15, gurgle: 1.35, h3: 0.35,
      start: [0.35, 0.5], target: [0.5, 0.95], scale: 10,
      note: '胴の空気がバネ、首の空気がオモリになるヘルムホルツ共鳴。<code>f ≈ (c/2π)·√(A / V·L)</code>。水が首に届くと筒の共鳴に切り替わり、首は細いので水位も音程も一気に上がる。'
    },
    mug: {
      name: 'マグ', prof: [[0, 40], [85, 42]], kind: 'tube', handle: true,
      Q: 64000, qRes: 5, gurgle: 1.1, h3: 0.6,
      start: [0, 0.2], target: [0.35, 0.9], scale: 7,
      note: '深さ85mm・口径84mm。口が広いぶん開口端補正（0.6r）が大きく、深さの割に低く鳴る。共鳴も鈍く、音程がぼやける。'
    }
  };
  const LIQUIDS = {
    water: { name: '水', c: 343000, note: '' },
    hot: { name: 'お湯', c: 355000, note: 'お湯：器の中の空気が温まって音速が上がり（約355m/s）、同じ水位でも約0.6半音高く鳴る。泡立ちも細かく、軽い音になる。' }
  };
  const GAMES = { edge: '通常モード', match: 'お手本モード' };
  const TENSION = 1.5;
  const TAU_UP = 0.15, TAU_DOWN = 0.12;

  function radius(v, h) {
    const p = v.prof;
    if (h <= p[0][0]) return p[0][1];
    for (let i = 1; i < p.length; i++) {
      if (h <= p[i][0]) { const t = (h - p[i - 1][0]) / (p[i][0] - p[i - 1][0]); return p[i - 1][1] + (p[i][1] - p[i - 1][1]) * t; }
    }
    return p[p.length - 1][1];
  }
  for (const v of Object.values(VESSELS)) {
    v.H = v.prof[v.prof.length - 1][0];
    v.rTop = v.prof[v.prof.length - 1][1];
    v.rMax = Math.max(...v.prof.map(p => p[1]));
    const step = 0.25, n = Math.ceil(v.H / step) + 1;
    v.cum = new Float64Array(n + 1);
    for (let i = 1; i <= n; i++) { const r = radius(v, (i - 0.5) * step); v.cum[i] = v.cum[i - 1] + Math.PI * r * r * step; }
    v.step = step;
  }
  const area = (v, h) => { const r = radius(v, Math.min(Math.max(h, 0), v.H)); return Math.PI * r * r; };
  function vol(v, h) {
    const x = Math.min(Math.max(h, 0), v.H) / v.step, i = Math.floor(x), f = x - i;
    const a = v.cum[Math.min(i, v.cum.length - 1)], b = v.cum[Math.min(i + 1, v.cum.length - 1)];
    return a + (b - a) * f;
  }
  function freqOf(v, lv, c) {
    const rt = v.rTop;
    if (v.kind === 'helm' && lv < v.neckStart) {
      const Vol = Math.max(vol(v, v.neckStart) - vol(v, lv), 1);
      const An = Math.PI * rt * rt, Ln = v.H - v.neckStart, Leff = Ln + 1.5 * rt;
      const fh = c / (2 * Math.PI) * Math.sqrt(An / (Vol * Leff));
      const fq = c / (4 * (Ln + 0.6 * rt));
      return 1 / Math.sqrt(1 / (fh * fh) + 1 / (fq * fq));
    }
    return c / (4 * (Math.max(v.H - lv, 0) + 0.6 * rt));
  }

  const $ = s => document.querySelector(s);
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const btn = $('#pour'), info = $('#info'), statusEl = $('#status'), demoBtn = $('#demo');
  const rand = (a, b) => a + Math.random() * (b - a);
  const fmt1 = n => (Math.round(n * 10) / 10).toFixed(1);
  const fmtHz = n => Math.round(n).toLocaleString('ja-JP');
  const signed = n => (n >= 0 ? '+' : '−') + fmt1(Math.abs(n));

  // ---------- 保存（この端末のみ） ----------
  const KEY = 'sosogu.v2';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { saved = {}; }
  let hist = Array.isArray(saved.hist) ? saved.hist : [];
  let bests = saved.bests && typeof saved.bests === 'object' ? saved.bests : {};
  let game = ['edge', 'match'].includes(saved.game) ? saved.game : 'edge';
  let vesselId = VESSELS[saved.vessel] ? saved.vessel : 'glass';
  let liquidId = LIQUIDS[saved.liquid] ? saved.liquid : 'water';
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ hist, bests, game, vessel: vesselId, liquid: liquidId })); } catch (e) {} };
  const V = () => VESSELS[vesselId];
  const L = () => LIQUIDS[liquidId];
  const keyFor = g => `${g}|${vesselId}|${liquidId}`;
  const comboKey = () => keyFor(game);

  // ---------- 状態 ----------
  // title
  // edge : demo(練習・一度だけ見える) → ready → pouring → settling → result
  // match: mready → model → mgap → mwait → pouring → settling → result
  let screen = 'title';
  let state = 'title', level = 0, flow = 0, Qr = 0, holding = false;
  let reveal = 0, result = null, releaseLevel = 0, speedLabel = '';
  let startLevel = 0, target = null, modelQ = 0, playerQ = 0, modelRelease = 0, gapT = 0;
  let gurgle = 1, nextG = 0, needTap = false;
  const busy = () => ['pouring', 'settling', 'demo', 'model', 'mgap'].includes(state);

  const speedName = (q, base) => { const r = q / base; return r < 0.93 ? 'ゆっくり' : r < 1.1 ? 'ふつう' : '速め'; };
  const tailEstimate = (q, h) => TAU_DOWN * q / area(V(), h);

  function newRound() {
    const v = V();
    flow = 0; holding = false; reveal = 0; result = null; needTap = false;
    startLevel = rand(v.start[0], v.start[1]) * v.H;
    level = startLevel;
    if (game === 'edge') {
      Qr = v.Q * rand(0.8, 1.25);
      speedLabel = speedName(Qr, v.Q);
      state = 'ready';
    } else {
      modelQ = v.Q * rand(0.8, 1.25);
      do { playerQ = v.Q * rand(0.8, 1.25); } while (Math.abs(playerQ - modelQ) / v.Q < 0.12);
      const tgt = rand(v.target[0], v.target[1]) * v.H;
      modelRelease = Math.max(startLevel + 5, tgt - tailEstimate(modelQ, tgt));
      target = null;
      state = 'mready';
    }
    renderAll();
  }

  // ---------- 画面の切り替え ----------
  function enterGame(g) {
    game = g; persist();
    screen = 'game';
    $('#screen-title').hidden = true;
    $('#screen-game').hidden = false;
    $('#mode-title').textContent = GAMES[g];
    resize();
    window.scrollTo(0, 0);
    if (g === 'edge') startPractice();
    else newRound();
  }
  function toTitle() {
    holding = false; flow = 0; state = 'title'; screen = 'title';
    $('#screen-game').hidden = true;
    $('#screen-title').hidden = false;
    renderTitle();
    window.scrollTo(0, 0);
  }

  // ---------- 音 ----------
  let ac = null, A = null;
  function initAudio() {
    if (ac) { if (ac.state === 'suspended') ac.resume().catch(() => {}); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    const len = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, len, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;

    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const comp = ac.createDynamicsCompressor(); comp.connect(ac.destination);
    const master = ac.createGain(); master.gain.value = 0; master.connect(comp);
    const bp1 = ac.createBiquadFilter(); bp1.type = 'bandpass';
    const g1 = ac.createGain(); g1.gain.value = 0;
    const bp3 = ac.createBiquadFilter(); bp3.type = 'bandpass';
    const g3 = ac.createGain(); g3.gain.value = 0;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 3200;
    const gh = ac.createGain(); gh.gain.value = 0;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220;
    const gl = ac.createGain(); gl.gain.value = 0;
    src.connect(bp1).connect(g1).connect(master);
    src.connect(bp3).connect(g3).connect(master);
    src.connect(hp).connect(gh).connect(master);
    src.connect(lp).connect(gl).connect(master);
    src.start();
    A = { buf, master, comp, bp1, g1, bp3, g3, gh, gl };
    ac.onstatechange = renderSound;
  }

  let silentEl = null;
  function silentWav() {
    const n = 800, rate = 8000, buf = new ArrayBuffer(44 + n), dv = new DataView(buf);
    const w = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
    w(0, 'RIFF'); dv.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
    dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, rate, true); dv.setUint32(28, rate, true); dv.setUint16(32, 1, true); dv.setUint16(34, 8, true);
    w(36, 'data'); dv.setUint32(40, n, true);
    for (let i = 0; i < n; i++) dv.setUint8(44 + i, 128);
    let s = ''; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b));
    return 'data:audio/wav;base64,' + btoa(s);
  }
  function unlock() {
    initAudio();
    if (!ac) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (!navigator.audioSession && /iP(hone|ad|od)|Macintosh/.test(navigator.userAgent) && 'ontouchend' in document) {
      try {
        if (!silentEl) { silentEl = new Audio(silentWav()); silentEl.loop = true; silentEl.setAttribute('playsinline', ''); }
        silentEl.play().catch(() => {});
      } catch (e) {}
    }
    if (ac.state !== 'running') ac.resume().then(renderSound).catch(() => {});
    try { const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource(); s.buffer = b; s.connect(ac.destination); s.start(0); } catch (e) {}
    renderSound();
  }
  ['pointerup', 'touchend', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, unlock, { capture: true }));
  const audioOn = () => !!ac && ac.state === 'running';

  function chime() {
    if (!audioOn()) return;
    const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(880, t); o.frequency.exponentialRampToValueAtTime(1760, t + 0.25);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g).connect(A.comp); o.start(t); o.stop(t + 0.5);
  }
  function splash() {
    if (!A) return;
    const t = ac.currentTime;
    const s = ac.createBufferSource(); s.buffer = A.buf;
    const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1300; f.Q.value = 0.7;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.7, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0008, t + 1.1);
    s.connect(f).connect(g).connect(A.comp);
    s.start(t); s.stop(t + 1.2);
  }

  function updateAudio(now) {
    if (!A) return;
    const v = V(), hot = liquidId === 'hot';
    const t = ac.currentTime;
    const f = Math.min(freqOf(v, Math.min(level, v.H), L().c), 12000);
    const jit = 1 + (Math.random() - 0.5) * 0.02;
    A.bp1.Q.value = v.qRes;
    A.bp3.Q.value = v.qRes * 0.7;
    A.bp1.frequency.setTargetAtTime(f * jit, t, 0.015);
    A.bp3.frequency.setTargetAtTime(Math.min(f * 3 * jit, 16000), t, 0.015);
    if (now > nextG) {
      if (hot) { gurgle = 0.65 + Math.random() * 0.5; nextG = now + rand(12, 30); }
      else { gurgle = 0.35 + Math.random() * Math.random() * 1.3 * v.gurgle; nextG = now + rand(25, 70) * (v.gurgle > 1.2 ? 1.5 : 1); }
    }
    const k = Math.sqrt(650 / f);
    const helmPhase = v.kind === 'helm' && level < v.neckStart;
    A.g1.gain.setTargetAtTime(14 * k * gurgle, t, 0.01);
    A.g3.gain.setTargetAtTime(3.2 * k * gurgle * (helmPhase ? 0.3 : v.h3), t, 0.01);
    A.gh.gain.setTargetAtTime(hot ? 0.075 : 0.03, t, 0.05);
    const empty = 1 - Math.min(level / v.H, 1);
    A.gl.gain.setTargetAtTime((hot ? 0.3 : 0.6) * empty * empty * gurgle, t, 0.02);
    A.master.gain.setTargetAtTime(0.8 * flow, t, 0.03);
  }

  // ---------- 操作 ----------
  function press(kind) {
    if (screen !== 'game') return;
    initAudio();
    if (state === 'result') { newRound(); return; }
    if (!['ready', 'mready', 'mwait'].includes(state)) return;
    if (!audioOn() && kind === 'touch') { needTap = true; renderStatus(); return; }
    needTap = false;
    if (state === 'mready') { playModel(); return; }
    if (state === 'mwait') { level = startLevel; Qr = playerQ; speedLabel = speedName(playerQ, V().Q); }
    state = 'pouring'; holding = true;
    renderAll();
  }
  function release() {
    if (state !== 'pouring') return;

  function startPractice() {
    initAudio();
    const v = V();
    level = v.start[0] * v.H; Qr = v.Q; flow = 0; holding = true; result = null; state = 'demo';
    modelRelease = v.H - tailEstimate(Qr, v.H) - 2;

  function skipPractice() {

  }

  function recordScore(entry) {
    const key = comboKey();
    const before = bests[key];
    const newBest = entry.s > 0 && (before === undefined || entry.s > before);
    if (before === undefined || entry.s > before) bests[key] = entry.s;
    hist.unshift({ ...entry, key });
    hist = hist.slice(0, 80);
    persist();
    return newBest;
  }

  function finish(over) {
    const v = V();
    const f = freqOf(v, Math.min(level, v.H), L().c);
    let r;
    if (game === 'edge') {
      const gap = v.H - level;
      if (over) r = { kind: 'over', label: '溢れた', score: 0 };
      else if (gap <= 0) r = { kind: 'top', label: '表面張力', score: 100 };
      else {
        const label = gap <= 2 ? 'すりきり' : gap <= 6 ? 'なみなみ' : gap <= v.H * 0.2 ? '八分目より上' : 'まだ入る';
        r = { kind: gap <= 2 ? 'top' : 'ok', label, score: Math.round(100 * Math.exp(-gap / v.scale)) };
      }
      r.gap = gap;
      r.newBest = recordScore({ g: 'edge', d: +gap.toFixed(1), s: r.score, o: over });
    } else {
      const diff = level - target;
      const ad = Math.abs(diff);
      if (over) r = { kind: 'over', label: '溢れた', score: 0 };
      else {
        const label = ad <= 1.5 ? 'ぴったり' : ad <= 4 ? 'ほぼ同じ' : ad <= 10 ? '惜しい' : 'ずれた';
        r = { kind: ad <= 1.5 ? 'top' : 'ok', label, score: Math.round(100 * Math.exp(-ad / (v.scale * 0.7))) };
      }
      r.diff = diff;
      r.fTarget = freqOf(v, Math.min(target, v.H), L().c);
      r.semis = 12 * Math.log2(f / r.fTarget);
      r.newBest = recordScore({ g: 'match', d: +diff.toFixed(1), s: r.score, o: over });
    }
    if (over) splash();
    r.f = f;
    r.overWhileHolding = over && state === 'pouring';
    r.tail = over ? 0 : level - releaseLevel;
    result = r; holding = false; state = 'result'; reveal = 0;
    renderAll();
  }

  btn.addEventListener('pointerdown', e => {

      else items = [['1', 'ボタンを押しているあいだ注がれます。縁ぎりぎりだと思ったら離す。'], ['2', '離しても少しだけ水は落ち続けます。溢れたら0点。'], ['3', tips[vesselId]]];

      else if (state === 'mgap') items = [['♪', 'いったん水を捨てて、同じところから始めます。']];

      else items = [['1', 'お手本が決まった量を注ぐ音を聴きます。'], ['2', 'そのあと、同じ量を目隠しで注ぎます。多すぎても少なすぎても減点。'], ['3', tips[vesselId]]];

  // ---------- 描画 ----------
  let col = {};
  function readColors() {
    const s = getComputedStyle(document.documentElement);
    ['water', 'glass', 'spill', 'porcelain', 'mist', 'good', 'pot', 'ink'].forEach(k => col[k] = s.getPropertyValue('--' + k).trim());
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(cv.clientWidth * dpr);
    cv.height = Math.round(cv.clientHeight * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const ease = t => 1 - Math.pow(1 - t, 3);
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const MONO = '500 12px "DM Mono", ui-monospace, monospace';
  let potTilt = 0;

  // ポット：注ぎ口の先を原点に描き、そこを軸に傾ける
  function drawPot(tipX, tipY, s, tilt, alpha, now) {
    ctx.save();
    ctx.translate(tipX, tipY);
    ctx.rotate(tilt);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = col.porcelain; ctx.fillStyle = col.pot; ctx.lineWidth = 1.6 / s;

    // 注ぎ口
    ctx.beginPath();
    ctx.moveTo(-34, 14);
    ctx.quadraticCurveTo(-16, 10, -3, -4);
    ctx.lineTo(3, 1);
    ctx.quadraticCurveTo(-12, 26, -30, 36);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    // 取っ手
    ctx.lineWidth = 5 / s; ctx.strokeStyle = col.pot;
    ctx.beginPath(); ctx.ellipse(-100, 24, 13, 17, 0, Math.PI * 0.45, Math.PI * 1.55); ctx.stroke();
    ctx.lineWidth = 1.6 / s; ctx.strokeStyle = col.porcelain;
    ctx.beginPath(); ctx.ellipse(-100, 24, 16, 20, 0, Math.PI * 0.45, Math.PI * 1.55); ctx.stroke();
    // 胴
    ctx.beginPath(); ctx.ellipse(-62, 26, 38, 29, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 光沢
    ctx.save(); ctx.globalAlpha = alpha * 0.25; ctx.strokeStyle = col.porcelain; ctx.lineWidth = 3 / s;
    ctx.beginPath(); ctx.ellipse(-62, 26, 28, 20, 0, Math.PI * 1.1, Math.PI * 1.45); ctx.stroke(); ctx.restore();
    // 蓋とつまみ
    ctx.beginPath(); ctx.ellipse(-62, -1, 18, 5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(-62, -8, 4.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

    // お湯なら注ぎ口と蓋から湯気
    if (liquidId === 'hot') {
      ctx.save();
      ctx.strokeStyle = col.porcelain; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
      const t = reduced ? 0 : now / 1000;
      const cosT = Math.cos(tilt), sinT = Math.sin(tilt);
      const lid = [tipX + (-62 * cosT - (-10) * sinT) * s, tipY + (-62 * sinT + (-10) * cosT) * s];
      const rise = reduced ? 0.5 : (t * 0.3) % 1;
      ctx.globalAlpha = 0.12 * Math.sin(Math.PI * rise) + 0.02;
      ctx.beginPath();
      for (let k = 0; k <= 14; k++) {
        const yy = lid[1] - 6 - k * 2.6 - rise * 10;
        const xx = lid[0] + Math.sin(k * 0.5 + t * 2) * (1.5 + k * 0.3);
        k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
      }
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw(now, dt) {
    if (screen !== 'game') return;
    const v = V();
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return;
    ctx.clearRect(0, 0, w, h);
    const extra = v.handle ? 26 : 0;
    const ppm = Math.min(h * 0.5 / v.H, (w * 0.56) / (2 * v.rMax + 2 * extra + 10));
    const botY = h * 0.84;
    const topY = botY - v.H * ppm;
    const cx = w / 2 + 20 - (v.handle ? extra * ppm * 0.5 : 0);
    const Y = hh => botY - hh * ppm;
    const X = (hh, s, inset = 0) => cx + s * (radius(v, hh) * ppm - inset);

    // 見えるのは練習（demo）と結果だけ
    const water = state === 'demo' ? 1 : state === 'result' ? ease(reveal) : 0;
    const lv = Math.min(level, v.H + TENSION);
    const ly = Y(Math.min(lv, v.H));
    const hidden = water < 0.001 && state !== 'result';
    const glassA = hidden ? 0.22 : 0.55;

    // 注ぐ位置
    const sx = v.kind === 'helm' ? cx : cx - v.rTop * ppm * 0.35;
    const potS = Math.max(0.62, Math.min(1, h / 430));
    const tipY = Math.max(topY - 42, 60 * potS);
    const wantTilt = -0.12 + 0.62 * Math.min(1, flow * 1.15);
    potTilt += (wantTilt - potTilt) * (1 - Math.exp(-(dt || 0.016) / 0.08));

    // 見えないときは音に合わせて揺れる光だけ
    if (hidden && flow > 0.01) {
      const rr = Math.min(h * 0.45, v.H * ppm * 0.7) * (0.6 + 0.3 * gurgle * flow);
      const g = ctx.createRadialGradient(cx, (topY + botY) / 2, 0, cx, (topY + botY) / 2, rr);
      g.addColorStop(0, col.water); g.addColorStop(1, 'transparent');
      ctx.save(); ctx.globalAlpha = 0.16 * flow; ctx.fillStyle = g; ctx.fillRect(0, 0, w, h); ctx.restore();
    }

    // 水
    if (water > 0.001 && lv > 0) {
      const inset = 2.5;
      const lvC = Math.min(lv, v.H);
      const pts = v.prof.filter(p => p[0] > 0 && p[0] < lvC).map(p => p[0]);
      ctx.save();
      ctx.globalAlpha = water * 0.8;
      const grad = ctx.createLinearGradient(0, ly, 0, botY);
      grad.addColorStop(0, col.water); grad.addColorStop(1, 'rgba(60,110,140,0.9)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(X(0, -1, inset), botY);
      ctx.lineTo(X(0, 1, inset), botY);
      pts.forEach(p => ctx.lineTo(X(p, 1, inset), Y(p)));
      ctx.lineTo(X(lvC, 1, inset), Y(lvC));
      if (lv > v.H) ctx.quadraticCurveTo(cx, topY - (lv - v.H) * ppm * 2.2, X(lvC, -1, inset), Y(lvC));
      else ctx.lineTo(X(lvC, -1, inset), Y(lvC));
      pts.slice().reverse().forEach(p => ctx.lineTo(X(p, -1, inset), Y(p)));
      ctx.closePath(); ctx.fill();
      if (lv <= v.H) {
        ctx.globalAlpha = water; ctx.strokeStyle = col.porcelain; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(X(lvC, -1, inset), ly); ctx.lineTo(X(lvC, 1, inset), ly); ctx.stroke();
      }
      ctx.restore();
    }

    // 溢れ
    if (state === 'result' && result && result.kind === 'over') {
      const a = ease(reveal);
      ctx.save(); ctx.globalAlpha = 0.75 * a; ctx.fillStyle = col.water; ctx.strokeStyle = col.water; ctx.lineWidth = 3; ctx.lineCap = 'round';
      [-1, 1].forEach(s => {
        ctx.beginPath();
        ctx.moveTo(X(v.H, s) + s * 2, topY);
        const steps = 12;
        for (let i = 1; i <= steps * a; i++) { const hh = v.H * (1 - i / steps); ctx.lineTo(X(hh, s) + s * 3, Y(hh)); }
        ctx.stroke();
      });
      ctx.beginPath(); ctx.ellipse(cx, botY + 12, (v.rMax * ppm + 30) * a + 1, 6 * a + 1, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // 器
    ctx.save();
    ctx.globalAlpha = glassA;
    ctx.strokeStyle = col.glass; ctx.lineWidth = 2; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let i = v.prof.length - 1; i >= 0; i--) { const [hh] = v.prof[i]; const x = X(hh, -1) - 1; i === v.prof.length - 1 ? ctx.moveTo(x, Y(hh)) : ctx.lineTo(x, Y(hh)); }
    ctx.lineTo(X(0, -1) - 1, botY + 9);
    ctx.lineTo(X(0, 1) + 1, botY + 9);
    v.prof.forEach(([hh]) => ctx.lineTo(X(hh, 1) + 1, Y(hh)));
    ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X(0, -1), botY); ctx.lineTo(X(0, 1), botY); ctx.stroke();
    if (v.handle) {
      ctx.lineWidth = 3;
      const x0 = X(v.H * 0.78, 1) + 1, x1 = X(v.H * 0.22, 1) + 1, xo = cx + (v.rTop + extra) * ppm;
      ctx.beginPath(); ctx.moveTo(x0, Y(v.H * 0.78));
      ctx.bezierCurveTo(xo, Y(v.H * 0.86), xo, Y(v.H * 0.12), x1, Y(v.H * 0.22)); ctx.stroke();
    }
    ctx.globalAlpha = glassA * 0.35; ctx.lineWidth = 3;
    const hl = v.kind === 'helm' ? [v.prof[1][0] * 0.85, v.prof[1][0] * 0.15] : [v.H * 0.88, v.H * 0.2];
    ctx.beginPath(); ctx.moveTo(X(hl[0], -1) + 9, Y(hl[0])); ctx.lineTo(X(hl[1], -1) + 9, Y(hl[1])); ctx.stroke();
    ctx.restore();

    // 器から立つ湯気（水位の手がかりにならないよう、口の上に出すだけ）
    if (liquidId === 'hot' && level > 3 && v.kind !== 'helm') {
      ctx.save();
      ctx.strokeStyle = col.porcelain; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let i = 0; i < 2; i++) {
        const t = reduced ? 0 : now / 1000 + i * 1.7;
        const x0 = cx + (i ? 1 : -1) * v.rTop * ppm * 0.45;
        const rise = reduced ? 0.5 : (t * 0.35) % 1;
        ctx.globalAlpha = 0.12 * Math.sin(Math.PI * rise) + 0.02;
        ctx.beginPath();
        for (let k = 0; k <= 16; k++) {
          const yy = topY - 6 - k * 3 - rise * 12;
          const xx = x0 + Math.sin(k * 0.45 + t * 2.2) * (2 + k * 0.35);
          k ? ctx.lineTo(xx, yy) : ctx.moveTo(xx, yy);
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    // 水流：注ぎ口から器の口へ
    const flowA = Math.min(1, flow * 1.5);
    if (flow > 0.01) {
      const sw = 1.2 + flow * 5.5 * Math.sqrt(v.Q / 64000);
      const wob = reduced ? 0 : Math.sin(now / 85) * 1.1 * flow;
      ctx.save();
      ctx.strokeStyle = col.water; ctx.lineCap = 'round'; ctx.lineWidth = sw;
      ctx.globalAlpha = 0.85 * flowA;
      ctx.beginPath();
      ctx.moveTo(sx + 1, tipY);
      ctx.quadraticCurveTo(sx + 5 * flow + wob, tipY + (topY - tipY) * 0.35, sx + wob, topY);
      ctx.stroke();
      if (water > 0.001) {
        ctx.globalAlpha = water * 0.8 * flowA;
        ctx.beginPath(); ctx.moveTo(sx + wob, topY); ctx.lineTo(sx + wob, Math.max(ly, topY)); ctx.stroke();
      }
      ctx.restore();
    }

    // ポット
    drawPot(sx, tipY, potS, potTilt, 0.95, now);

    // 練習中の共鳴表示
    if (state === 'demo') {
      ctx.save();
      ctx.fillStyle = col.mist; ctx.font = MONO; ctx.textBaseline = 'top'; ctx.textAlign = 'right';
      const f = freqOf(v, Math.min(level, v.H), L().c);
      const phase = v.kind === 'helm' ? (level < v.neckStart ? '胴：ヘルムホルツ' : '首：筒の共鳴') : '筒の共鳴';
      ctx.fillText(`共鳴 ${fmtHz(f)} Hz`, w - 14, 34);
      ctx.fillText(`水位 ${Math.round(Math.min(level, v.H) / v.H * 100)}%`, w - 14, 52);
      ctx.fillText(phase, w - 14, 70);
      ctx.restore();
    }

    // 結果の寸法線
    if (state === 'result' && result && result.kind !== 'over') {
      const a = ease(reveal);
      const rightX = cx + (v.rTop + extra) * ppm + 8;
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = MONO; ctx.lineWidth = 1;
      // 寸法はポットと重ならないよう器の右側に
      const bx = rightX;
      const bracket = (y1, y2) => {
        ctx.beginPath();
        ctx.moveTo(bx - 4, y1); ctx.lineTo(bx + 4, y1);
        ctx.moveTo(bx, y1); ctx.lineTo(bx, y2);
        ctx.moveTo(bx - 4, y2); ctx.lineTo(bx + 4, y2);
        ctx.stroke();
      };
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      if (game === 'edge') {
        ctx.strokeStyle = col.porcelain; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(X(v.H, -1) - 8, topY); ctx.lineTo(bx + 4, topY); ctx.stroke();
        ctx.setLineDash([]);
        if (lv < v.H) bracket(topY, ly);
        ctx.fillStyle = col.mist;
        ctx.fillText('縁', bx + 9, topY - 11);
        ctx.fillStyle = result.kind === 'top' ? col.good : col.porcelain;
        const txt = result.gap <= 0 ? `+${fmt1(-result.gap)} mm` : `${fmt1(result.gap)} mm`;
        ctx.fillText(txt, bx + 9, lv < v.H && (ly - topY) > 22 ? (topY + ly) / 2 : topY + 11);
      } else {
        const ty = Y(Math.min(target, v.H));
        ctx.strokeStyle = col.good; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(X(target, -1) - 8, ty); ctx.lineTo(bx + 4, ty); ctx.stroke();
        ctx.setLineDash([]);
        ctx.strokeStyle = col.porcelain;
        if (Math.abs(ly - ty) > 2) bracket(ty, ly);
        ctx.fillStyle = col.good;
        ctx.fillText('お手本', bx + 9, ty);
        ctx.fillStyle = result.kind === 'top' ? col.good : col.porcelain;
        const gapPx = Math.abs(ly - ty);
        ctx.fillText(`${signed(result.diff)} mm`, bx + 9, gapPx > 36 ? (ty + ly) / 2 : Math.max(ty, ly) + 16);
      }
      ctx.restore();
    }
  }

  // ---------- ループ ----------
  let last = performance.now();
  function tick(now) {
    const v = V();
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    flow += ((holding ? 1 : 0) - flow) * (1 - Math.exp(-dt / (holding ? TAU_UP : TAU_DOWN)));
    if (!holding && flow < 0.0005) flow = 0;

    if (['pouring', 'settling', 'demo', 'model'].includes(state)) {
      level += flow * Qr / area(v, Math.min(level, v.H)) * dt;
      if (state === 'demo' || state === 'model') {
        if (holding && level >= modelRelease) holding = false;
        if (!holding && flow < 0.004) {
          if (state === 'demo') newRound();
          else { target = level; state = 'mgap'; gapT = 0.8; renderAll(); }
        }
      } else if (level > v.H + TENSION) {
        level = v.H + TENSION; finish(true);
      } else if (state === 'settling' && flow < 0.004) {
        finish(false);
      }
    } else if (state === 'mgap') {
      gapT -= dt;
      if (gapT <= 0) { level = startLevel; state = 'mwait'; renderAll(); }
    }
    if (state === 'result') reveal = Math.min(1, reveal + dt / 0.8);

    updateAudio(now);
    draw(now, dt);
    requestAnimationFrame(tick);
  }

  readColors();
  if ('ResizeObserver' in window) new ResizeObserver(resize).observe(cv);
  else window.addEventListener('resize', resize);
  renderTitle();
  renderSound();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
